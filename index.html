<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SmartPark</title>
<style>
  :root { --bg:#f3f5f7; --card:#fff; --ink:#14202b; --mute:#66737f; --line:#d9e0e6; --accent:#0a6cff; --free:#1f9d55; --busy:#c9d1d8; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width:460px; margin:0 auto; padding:20px 16px 40px; }
  h1 { font-size:1.5rem; margin:0 0 4px; }
  p.sub { color:var(--mute); margin:0 0 20px; }
  .step { display:none; }
  .step.on { display:block; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:14px; }
  label { display:block; font-weight:600; margin:0 0 8px; }
  .opts { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:4px; }
  .opts button { flex:1 1 30%; padding:12px 8px; border:1.5px solid var(--line); background:#fff; border-radius:10px; font:inherit; cursor:pointer; }
  .opts button.sel { border-color:var(--accent); background:#eaf2ff; color:var(--accent); font-weight:600; }
  .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .slot { padding:14px 0; border-radius:8px; border:1.5px solid var(--free); background:#fff; color:var(--free); font:inherit; font-weight:600; cursor:pointer; }
  .slot:disabled { background:var(--busy); border-color:var(--busy); color:#7d8893; cursor:not-allowed; }
  .slot.sel { background:var(--free); color:#fff; }
  .go { width:100%; padding:14px; border:0; border-radius:10px; background:var(--accent); color:#fff; font:inherit; font-weight:600; cursor:pointer; }
  .go:disabled { background:#a9c6f5; cursor:not-allowed; }
  .back { background:none; border:0; color:var(--mute); font:inherit; cursor:pointer; padding:0; margin-bottom:12px; }
  .row { display:flex; justify-content:space-between; padding:6px 0; }
  .total { border-top:1px solid var(--line); margin-top:6px; padding-top:10px; font-weight:700; }
  .legend { color:var(--mute); font-size:.85rem; margin-top:10px; }
  :focus-visible { outline:3px solid #ffb300; outline-offset:2px; }
</style>
</head>
<body>
<main>
  <h1>SmartPark</h1>
  <p class="sub">Find a spot, book it, go.</p>

  <!-- Step 1 -->
  <section class="step on" id="s1">
    <div class="card">
      <label>Vehicle</label>
      <div class="opts" data-key="vehicle">
        <button data-v="Car" data-rate="20" class="sel">Car</button>
        <button data-v="Bike" data-rate="10">Bike</button>
        <button data-v="SUV" data-rate="30">SUV</button>
      </div>
    </div>
    <div class="card">
      <label>Area</label>
      <div class="opts" data-key="area">
        <button data-v="City Area" class="sel">City</button>
        <button data-v="College Area">College</button>
        <button data-v="Market Area">Market</button>
        <button data-v="Mall Area">Mall</button>
      </div>
    </div>
    <button class="go" id="to2">Find parking</button>
  </section>

  <!-- Step 2 -->
  <section class="step" id="s2">
    <button class="back" data-back="s1">← Back</button>
    <div class="card">
      <label id="areaTitle">Pick a slot</label>
      <div class="grid" id="grid"></div>
      <p class="legend">Green = free, grey = taken</p>
    </div>
    <button class="go" id="to3" disabled>Continue</button>
  </section>

  <!-- Step 3 -->
  <section class="step" id="s3">
    <button class="back" data-back="s2">← Back</button>
    <div class="card">
      <label>Hours</label>
      <div class="opts" data-key="hours">
        <button data-v="1" class="sel">1</button>
        <button data-v="2">2</button>
        <button data-v="3">3</button>
        <button data-v="4">4</button>
      </div>
    </div>
    <div class="card" id="summary"></div>
    <button class="go" id="book">Confirm booking</button>
  </section>

  <!-- Step 4 -->
  <section class="step" id="s4">
    <div class="card">
      <h1>Booked ✓</h1>
      <div id="done"></div>
    </div>
    <a id="maps" target="_blank" rel="noopener"><button class="go" style="margin-bottom:10px">Open in Google Maps</button></a>
    <button class="go" id="again" style="background:#fff;color:var(--accent);border:1.5px solid var(--accent)">New search</button>
  </section>
</main>

<script>
  const state = { vehicle:"Car", rate:20, area:"City Area", hours:1, slot:null };
  const $ = id => document.getElementById(id);
  const show = id => { document.querySelectorAll(".step").forEach(s => s.classList.toggle("on", s.id === id)); window.scrollTo(0,0); };

  // option groups
  document.querySelectorAll(".opts").forEach(group => {
    group.addEventListener("click", e => {
      const b = e.target.closest("button"); if (!b) return;
      group.querySelectorAll("button").forEach(x => x.classList.remove("sel"));
      b.classList.add("sel");
      state[group.dataset.key] = b.dataset.v;
      if (b.dataset.rate) state.rate = +b.dataset.rate;
      if (group.dataset.key === "hours") renderSummary();
    });
  });

  document.querySelectorAll("[data-back]").forEach(b => b.onclick = () => show(b.dataset.back));

  // slots: random taken spots, 12 per area
  function renderGrid() {
    $("areaTitle").textContent = state.area + " - pick a slot";
    state.slot = null; $("to3").disabled = true;
    const grid = $("grid"); grid.innerHTML = "";
    for (let i = 1; i <= 12; i++) {
      const b = document.createElement("button");
      b.className = "slot"; b.textContent = "P" + i;
      if (Math.random() < 0.35) b.disabled = true;
      b.onclick = () => {
        grid.querySelectorAll(".slot").forEach(x => x.classList.remove("sel"));
        b.classList.add("sel"); state.slot = "P" + i; $("to3").disabled = false;
      };
      grid.appendChild(b);
    }
  }

  function total() { return state.rate * state.hours; }
  function renderSummary() {
    $("summary").innerHTML =
      `<div class="row"><span>${state.vehicle} · ${state.area}</span><span>${state.slot}</span></div>
       <div class="row"><span>₹${state.rate}/hour × ${state.hours}</span><span>₹${total()}</span></div>
       <div class="row total"><span>Total</span><span>₹${total()}</span></div>`;
  }

  $("to2").onclick = () => { renderGrid(); show("s2"); };
  $("to3").onclick = () => { renderSummary(); show("s3"); };
  $("book").onclick = () => {
    $("done").innerHTML =
      `<div class="row"><span>Slot</span><b>${state.slot}</b></div>
       <div class="row"><span>Area</span><b>${state.area}</b></div>
       <div class="row"><span>Vehicle</span><b>${state.vehicle}</b></div>
       <div class="row"><span>Paid</span><b>₹${total()}</b></div>`;
    $("maps").href = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent("parking " + state.area);
    show("s4");
  };
  $("again").onclick = () => show("s1");
</script>
</body>
</html>
